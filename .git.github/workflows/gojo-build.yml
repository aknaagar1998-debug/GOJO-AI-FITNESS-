
name: GOJO AI FITNESS NEW APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract new Android project
        run: |
          unzip -q GOJO_AI_FITNESS_NEW_SOURCE.zip -d project

      - name: Build GOJO APK
        run: |
          gradle --no-daemon -p project assembleDebug

      - name: Upload GOJO APK
        uses: actions/upload-artifact@v4
        with:
          name: GOJO-AI-FITNESS-NEW
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
